name: Build and publish container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck

  checks:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Cache Bun package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: bun run test

      - name: Show migration and backup coverage
        run: |
          bun test --coverage --coverage-reporter=text --coverage-reporter=lcov tests/migrations.test.ts tests/maintenance.test.ts
          echo 'Migration and deadline helper line coverage: see maintenance-coverage artifact. Backup, restore, owner recovery and upload cleanup are verified by CLI subprocess tests; subprocess lines are not included in Bun coverage.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload maintenance coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-coverage
          path: coverage/lcov.info

      - name: Check formatting
        run: bun run format:check

      - name: Build frontend
        run: bun --bun vite build

      - name: Smoke test production container
        run: |
          docker build -t printroom-ci .
          docker run -d --name printroom-ci -p 3000:3000 printroom-ci
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker logs printroom-ci; fi
            docker rm -f printroom-ci >/dev/null
            exit "$status"
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/healthz >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          [ "$ready" = true ]
          curl --fail --silent http://localhost:3000/api/bootstrap | bun -e 'const data = await Bun.stdin.json(); if (data.needsSetup !== true || data.user !== null) process.exit(1)'
          curl --fail --silent http://localhost:3000/ | bun -e 'if (!(await Bun.stdin.text()).includes("<html")) process.exit(1)'
          docker exec printroom-ci bun -e 'const sw = await Bun.file("dist/sw.js").text(); if (sw.includes("__BUILD_ID__") || !/printroom-shell-[a-f0-9]{16}/.test(sw)) process.exit(1)'

  container:
    if: github.event_name != 'pull_request'
    needs: [typecheck, checks]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Self-hosted 3D print order and filament hub

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
